# Taskfile — https://taskfile.dev
#
# The repo-root `package.json` forwards the same commands for anyone without
# `task` installed; this file is the fuller set. Run `task` (or `task --list`)
# to see everything.

version: "3"

vars:
  PROGRAM_ID: 4grKZpw6G2zmxv62iKzr8vCJU2g3oAArpcJEeTFimq3J
  DEVNET_RPC: https://api.devnet.solana.com

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install the web app's dependencies (pnpm)
    dir: apps/web
    cmds:
      - pnpm install

  dev:
    desc: Nuxt dev server on http://localhost:3000
    dir: apps/web
    cmds:
      - pnpm dev

  dev:all:
    desc: Axum API and Nuxt dev server together (the app's /api calls need both)
    deps: [api, dev]

  api:
    desc: Axum API on http://127.0.0.1:8787 (loads apps/web/.env)
    cmds:
      - cargo run --manifest-path apps/api/Cargo.toml --bin server

  build:
    desc: Production build of the web app
    dir: apps/web
    cmds:
      - pnpm build

  preview:
    desc: Serve the production build locally
    dir: apps/web
    cmds:
      - pnpm preview

  lint:
    desc: ESLint over the web app
    cmds:
      - pnpm lint

  typecheck:
    desc: nuxt typecheck over the web app
    cmds:
      - pnpm typecheck

  test:web:
    desc: Unit tests for the web app
    cmds:
      - pnpm -C apps/web test

  test:api:
    desc: Rust tests for the API
    cmds:
      - cargo test --manifest-path apps/api/Cargo.toml

  test:contracts:
    desc: Build the SBF program and run the contract suite
    cmds:
      - cargo build-sbf --manifest-path apps/contracts/programs/payvand/Cargo.toml
      - cargo test --manifest-path apps/contracts/Cargo.toml

  verify:
    desc: Full local check — lint, typecheck, and all three test suites
    cmds:
      - task: lint
      - task: typecheck
      - task: test:web
      - task: test:api
      - task: test:contracts

  anchor:test:
    desc: Anchor build (IDL) plus the SBF-backed contract test suite
    cmds:
      - cd apps/contracts && anchor build
      # Anchor 1.2.1 builds the eBPF target (arch v1), which solana-program-test
      # 3.1.10 cannot execute. Rebuild with cargo-build-sbf's default arch (v0)
      # so the suite runs the artifact the harness and CI use.
      - cargo build-sbf --manifest-path apps/contracts/programs/payvand/Cargo.toml
      - cargo test --manifest-path apps/contracts/Cargo.toml

  anchor:build:
    desc: Build the program and sync the IDL into the web app
    cmds:
      - pnpm anchor:build

  anchor:deploy:
    desc: Deploy the program to the cluster in Anchor.toml
    cmds:
      - pnpm anchor:deploy

  anchor:keys:
    desc: Show the program ids Anchor has on disk
    cmds:
      - pnpm anchor:keys

  idl:upload:
    desc: Build the IDL and publish it to the metadata account on devnet, then verify it
    dir: apps/contracts
    # One block, not `cmds`, so the PATH export reaches every command: `anchor`
    # needs the Solana CLI and self-installs a toolchain without it.
    cmds:
      - |
        set -e
        solana_bin="$HOME/.local/share/solana/install/active_release/bin"
        if [ -d "$solana_bin" ]; then PATH="$solana_bin:$PATH"; fi
        anchor idl build -o target/idl/payvand.json
        # The metadata account is not part of the program, so this is the step a
        # deploy does not do. The anchor idl buffer commands (`create-buffer`
        # then `write-buffer`) abort mid-plan on the public devnet RPC and leave
        # the account unreadable; see "Publishing the IDL" in README.md.
        npx -y @solana-program/program-metadata write idl {{.PROGRAM_ID}} \
          target/idl/payvand.json --rpc {{.DEVNET_RPC}} \
          -k "$HOME/.config/solana/id.json"
        # Fetching also goes through the rate-limited RPC, so retry rather than
        # fail a publish that already landed.
        fetched=0
        for attempt in 1 2 3; do
          if anchor idl fetch {{.PROGRAM_ID}} --provider.cluster {{.DEVNET_RPC}} \
            -o /tmp/payvand-idl-live.json; then fetched=1; break; fi
          sleep 5
        done
        if [ "$fetched" != 1 ]; then echo "could not fetch the IDL back from devnet"; exit 1; fi
        python3 -c "import json,sys; live=json.load(open('/tmp/payvand-idl-live.json')); built=json.load(open('target/idl/payvand.json')); sys.exit(0 if live==built else 'the on-chain IDL differs from target/idl/payvand.json')"

  # Both Vercel projects carry their own Root Directory, and `vercel deploy`
  # uploads the tree it is given. So each task assembles the upload tree the
  # project expects — the app folder inside its parents for the web project,
  # `apps/api` inside its parents for the API project — deploys that, and
  # deletes it. The production API is the `payvand-api` project: its address,
  # `payvand-api.vercel.app`, is the one the web app and the printed QR codes
  # point at, and a `.vercel.app` address belongs to the project of that name.
  deploy:web:
    desc: Deploy the web app to Vercel production
    cmds:
      - |
        set -e
        tree="$(mktemp -d)"
        trap 'rm -rf "$tree"' EXIT
        cp package.json pnpm-lock.yaml "$tree"/
        mkdir -p "$tree/apps"
        rsync -a --exclude node_modules --exclude .nuxt --exclude .output \
          --exclude .vercel --exclude '.env*' --exclude data \
          apps/web "$tree/apps/"
        VERCEL_TOKEN="$(tr -d '\n' < .vercel-token)" \
          vercel deploy "$tree" --prod --yes -p payvand

  deploy:api:
    desc: Deploy the API to Vercel production
    cmds:
      - |
        set -e
        tree="$(mktemp -d)"
        trap 'rm -rf "$tree"' EXIT
        mkdir -p "$tree/apps"
        rsync -a --exclude target --exclude .vercel --exclude '.env*' \
          --exclude data apps/api "$tree/apps/"
        VERCEL_TOKEN="$(tr -d '\n' < .vercel-token)" \
          vercel deploy "$tree" --prod --yes -p payvand-api

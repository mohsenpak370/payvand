[package]
name = "payvand-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
description = "Payvand API: payment request payloads and on-chain settlement status"
# Two bins are auto-discovered: src/main.rs (the Vercel function, named
# after the package — @vercel/rust zero-config builds exactly this one) and
# src/bin/server.rs (the local dev server, `pnpm api`). The builder invokes
# this default bin, so it must stay the Vercel entrypoint.
default-run = "payvand-server"

# Its own workspace so the Anchor workspace never has to resolve the
# server's Solana RPC client dependencies.
[workspace]

[lib]
name = "payvand_server"
path = "src/lib.rs"

# Declared explicitly because @vercel/rust resolves the bin to build from
# this section (a bare src/main.rs makes it guess `--bin main`).
[[bin]]
name = "payvand-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
vercel_runtime = { version = "2.4", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
solana-rpc-client = "3"
# The history read behind a settled invoice: its config types.
solana-rpc-client-api = "3"
solana-pubkey = { version = "3", features = ["curve25519"] }
# The settle transaction behind a receipt marker is addressed by signature.
solana-signature = "3"
# The commitment level of the invoice reads; already resolved through
# solana-rpc-client, named here because `fetch_payment` sets it explicitly.
solana-commitment-config = "3"
sha2 = "0.10"
# The sponsor decodes the buyer-signed transaction, rebuilds the one message it
# will sign, and submits it: the whole toolchain from one crate, re-exporting the
# same `solana-pubkey`/`solana-signature` types the client code already uses.
solana-sdk = "3"
bincode = "1.3"
libsql = "0.10"
# The subscription's live EUR/SOL and EUR/USD rate, over HTTPS from a public
# price feed. No key, so no credential to configure.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Parsing RPC endpoints the way a browser would, so a payment code cannot
# smuggle a different host past the allowlist in `payments::resolve_endpoint`.
url = "2"
# Solana Pay transaction requests: the invoice token and the wallet's
# transaction are base64.
base64 = "0.22"
# Wallet sign-in: base58 signature strings verified against the address.
ed25519-dalek = "2"
bs58 = "0.5"
argon2 = "0.6"
getrandom = "0.4"
# rustls (not native-tls/openssl) so the Vercel Linux builder needs no
# system TLS headers.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "pool", "builder", "hostname", "rustls-tls"] }
# Web push: RFC 8188 encryption and the VAPID signature are this crate's job.
# Its own HTTP clients are switched off — `push.rs` sends the request it builds
# through the reqwest client above, so the function keeps one TLS stack.
web-push = { version = "0.11", default-features = false }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

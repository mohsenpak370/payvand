<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payvand API</title>
    <meta name="description" content="Interactive reference for the Payvand API." />
    <!--
      Swagger UI renders the document at `/api/openapi.json`. It is loaded from
      a CDN on purpose: the Rust function should serve an API, not carry a
      megabyte of front-end assets inside its bundle. Sign in through
      `/api/auth/signin` (or the Authorize button with a token) to try a route
      that needs a session.
    -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css"
      integrity="sha384-wxLW6kwyHktdDGr6Pv1zgm/VGJh99lfUbzSn6HNHBENZlCN7W602k9VkGdxuFvPn"
      crossorigin="anonymous"
    />
    <style>
      body { margin: 0; background: #fafafa; }
      .topbar { display: none; }
      .swagger-ui .info { margin: 32px 0 16px; }
      #docs-notice {
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: #555;
        padding: 12px 20px;
        background: #fff;
        border-bottom: 1px solid #e5e5e5;
      }
      #docs-notice a { color: #2563eb; }
    </style>
  </head>
  <body>
    <div id="docs-notice">
      Interactive API reference. The raw document is at
      <a href="/api/openapi.json">/api/openapi.json</a>.
    </div>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" integrity="sha384-wmyclcVGX/WhUkdkATwhaK1X1JtiNrr2EoYJ+diV3vj4v6OC5yCeSu+yW13SYJep" crossorigin="anonymous"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: '/api/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        persistAuthorization: false,
        displayRequestDuration: true,
        tryItOutEnabled: false,
        presets: [SwaggerUIBundle.presets.apis],
        layout: 'BaseLayout'
      })
    </script>
  </body>
</html>

# pnpm 11 and later hold back versions published in the last day by default,
# and the check applies to every lockfile entry, so a fresh release fails the
# deploy's install rather than resolving. Off here because this project takes
# new drops of @vue-solana the day they are published; add a temporary window
# back (e.g. 1440) if a dependency is ever suspected of being compromised.
minimumReleaseAge: 0

allowBuilds:
  # @nuxt/content's build-time database needs the native addon, so unlike the
  # rest of this list its install script has to run.
  better-sqlite3: true
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

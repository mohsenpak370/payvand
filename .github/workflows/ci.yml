name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: apps/web

      - name: Lint
        run: pnpm run lint
        working-directory: apps/web

      - name: Typecheck
        run: pnpm run typecheck
        working-directory: apps/web

  contracts:
    runs-on: ubuntu-latest

    env:
      # Pinned to the version the SBF artifact and the committed program were
      # built with; `stable` would silently change the toolchain between runs.
      SOLANA_VERSION: "3.1.10"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The installer hands its own arguments to `agave-install-init`, which takes
      # no `-y` and picks the release from the script only when it is given none —
      # so the release is named here rather than left to the default.
      - name: Install Solana CLI ${{ env.SOLANA_VERSION }}
        run: |
          curl -sSfL "https://release.anza.xyz/v${SOLANA_VERSION}/install" \
            | sh -s -- "v${SOLANA_VERSION}" --no-modify-path
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Verify the Solana CLI version
        run: solana --version | grep -q "solana-cli ${SOLANA_VERSION}"

      - name: Cache Solana platform tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/solana
          key: solana-${{ env.SOLANA_VERSION }}-platform-tools-${{ runner.os }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/contracts -> target

      # The suite runs the deployable artifact inside `solana-program-test`,
      # so CI must build the same SBF program a deploy would upload.
      - name: Build the deployable program
        run: cargo build-sbf --manifest-path apps/contracts/programs/payvand/Cargo.toml

      - name: Test the Anchor program
        run: cargo test --manifest-path apps/contracts/Cargo.toml
